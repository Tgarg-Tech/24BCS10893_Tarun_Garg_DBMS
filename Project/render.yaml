services:
  - type: web
    runtime: static
    name: resolveit-web
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: resolveit-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: docker
    name: resolveit-api
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: APP_DB_HOST
        fromDatabase:
          name: resolveit-db
          property: host
      - key: APP_DB_PORT
        fromDatabase:
          name: resolveit-db
          property: port
      - key: APP_DB_NAME
        fromDatabase:
          name: resolveit-db
          property: database
      - key: APP_DB_USER
        fromDatabase:
          name: resolveit-db
          property: user
      - key: APP_DB_PASSWORD
        fromDatabase:
          name: resolveit-db
          property: password
      - key: APP_FRONTEND_ORIGIN
        fromService:
          type: web
          name: resolveit-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_FILE_STORAGE_PATH
        value: /tmp/resolveit-uploads
      - key: APP_SEED_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=55.0

databases:
  - name: resolveit-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    databaseName: resolveit
    user: resolveit_app
